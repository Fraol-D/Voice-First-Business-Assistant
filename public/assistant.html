<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant · Meri</title>
  <meta name="description" content="Meri — Voice-First Business Assistant">

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Synchronous Zero-Flash Theme Script -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme') || localStorage.getItem('meri-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --background: #0A0A0A;
      --foreground: #FFFFFF;
      --surface: #141414;
      --surface-card: #161616;
      --surface-subtle: #111111;
      --surface-strong: #1E1E1E;
      --border: #262626;
      --border-strong: #383838;
      --muted: #8E8E93;
      --faint: #737373;
      --accent: #FE6904;
      --accent-glow: rgba(254, 105, 4, 0.25);
      --accent-dim: rgba(254, 105, 4, 0.12);
    }

    [data-theme="light"], .light {
      --background: #F8F9FA;
      --foreground: #111827;
      --surface: #F0F2F5;
      --surface-card: #FFFFFF;
      --surface-subtle: #FFFFFF;
      --surface-strong: #E5E7EB;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --muted: #4B5563;
      --faint: #9CA3AF;
      --accent: #FE6904;
      --accent-glow: rgba(254, 105, 4, 0.18);
      --accent-dim: rgba(254, 105, 4, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .font-space { font-family: 'Space Grotesk', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }

    /* Header */
    header.assistant-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background-color: var(--background);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--foreground);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
      animation: pulse 2s infinite;
    }

    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Voice Orb */
    #voice-orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background-color: var(--background);
    }

    .orb-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: radial-gradient(circle at 45% 45%, var(--surface-strong) 0%, var(--surface) 55%, var(--background) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: orb-breathe 4s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes orb-breathe {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px 2px rgba(254, 105, 4, 0.12);
        border-color: rgba(254, 105, 4, 0.25);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 38px 6px rgba(254, 105, 4, 0.22);
        border-color: rgba(254, 105, 4, 0.45);
      }
    }

    .orb-core {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .orb-sublabel {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.75rem;
    }

    /* Feed */
    #assistant-feed {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .assistant-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.125rem 1.25rem;
    }

    .assistant-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      border-radius: 9999px;
      padding: 0.25rem 0.625rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge-sale {
      background-color: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(254, 105, 4, 0.3);
    }

    .badge-inventory {
      background-color: var(--surface-strong);
      color: var(--foreground);
      border: 1px solid var(--border);
    }

    .badge-clarification {
      background-color: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(254, 105, 4, 0.3);
    }

    .card-amount {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.375rem;
      color: var(--foreground);
      margin-top: 0.375rem;
    }

    .card-timestamp {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .card-option-btn {
      border-radius: 9999px;
      padding: 0.5rem 1.125rem;
      font-size: 0.8125rem;
      background-color: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--foreground);
      cursor: pointer;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
    }

    .user-feed-bubble {
      align-self: flex-end;
      border-radius: 16px;
      border-top-right-radius: 4px;
      background-color: var(--surface-strong);
      border: 1px solid var(--border);
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      color: var(--foreground);
      max-width: 80%;
    }

    /* Bottom Dock */
    .bottom-dock {
      border-top: 1px solid var(--border);
      background-color: var(--background);
      padding: 0.625rem 1rem 1rem;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    #suggestion-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    #suggestion-pills::-webkit-scrollbar { display: none; }

    .suggestion-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

    .suggestion-pill {
      border-radius: 9999px;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      padding: 0.375rem 0.875rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion-pill:hover {
      color: var(--foreground);
      border-color: var(--accent);
    }

    /* Unified Pill Text Input Form */
    #chat-form {
      border-radius: 9999px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 8px 6px 18px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }
    #chat-form:focus-within {
      border-color: #FE6904;
      box-shadow: 0 0 12px rgba(254, 105, 4, 0.15);
    }

    #chat-input {
      flex: 1;
      border: none !important;
      outline: none !important;
      background: transparent !important;
      box-shadow: none !important;
      color: var(--foreground);
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
    }

    #send-button {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      background-color: var(--surface-strong);
      color: var(--faint);
      transition: all 0.2s ease;
    }

    #send-button.active {
      background-color: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 0 14px rgba(254, 105, 4, 0.45);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="assistant-header">
    <a href="index.html" class="brand-link" aria-label="Back to home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
      <span>Meri</span>
    </a>

    <div class="header-controls">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Voice Ready</span>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Voice Orb Container (§13–§15, §18) -->
  <div id="voice-orb-container">
    <div class="orb-circle">
      <div class="orb-core">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </div>
    </div>
    <span class="orb-sublabel">Tap to speak or type below</span>
  </div>

  <!-- Conversation Feed (§20–§21, §23–§24) -->
  <div id="assistant-feed">
    <!-- Dummy Card 1: Sale Recorded -->
    <div class="assistant-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="assistant-card-badge badge-sale">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #FE6904; display: inline-block;"></span>
          Sale Recorded
        </span>
        <span class="card-timestamp">Today at 12:42 PM</span>
      </div>
      <div class="card-amount">3 shirts · ETB 900</div>
      <p style="font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem;">Recorded to today's sales balance</p>
    </div>

    <!-- Dummy Card 2: Inventory -->
    <div class="assistant-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="assistant-card-badge badge-inventory">Inventory</span>
        <span class="card-timestamp">Live count</span>
      </div>
      <div class="card-amount">17 shirts remaining</div>
      <p style="font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem;">Current inventory level</p>
    </div>

    <!-- Dummy Card 3: Clarification -->
    <div class="assistant-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="assistant-card-badge badge-clarification">Needs Clarification</span>
        <span class="card-timestamp">Needs input</span>
      </div>
      <p style="font-size: 0.875rem; color: var(--foreground); margin-top: 0.5rem;">Did you mean 900 birr in cash or transfer?</p>
      <div>
        <button type="button" class="card-option-btn" onclick="selectClarification('Cash')">Cash</button>
        <button type="button" class="card-option-btn" onclick="selectClarification('Transfer')">Transfer</button>
      </div>
    </div>
  </div>

  <!-- Bottom Dock (§18–§19, §29) -->
  <div class="bottom-dock">
    <div id="suggestion-pills">
      <span class="suggestion-label">Try asking:</span>
      <button type="button" class="suggestion-pill">Sold 2 jackets for 1200 birr</button>
      <button type="button" class="suggestion-pill">Expense: 400 birr for transport</button>
      <button type="button" class="suggestion-pill">Check stock for shirts</button>
    </div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Record transaction or ask a question..." autocomplete="off">
      <button id="send-button" type="submit" disabled aria-label="Send message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="public/assistant.js"></script>
  <script>
    function selectClarification(opt) {
      var input = document.getElementById('chat-input');
      if (input) {
        input.value = opt;
        input.focus();
        var sendBtn = document.getElementById('send-button');
        if (sendBtn) {
          sendBtn.classList.add('active');
          sendBtn.removeAttribute('disabled');
        }
      }
    }

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.documentElement.classList.remove('dark', 'light');
      document.documentElement.classList.add(next);
      localStorage.setItem('theme', next);
      localStorage.setItem('meri-theme', next);
    }
  </script>
</body>
</html>
